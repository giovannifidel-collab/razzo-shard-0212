name: GIO Cleanup Once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gio-cleanup-once.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Cancel audited GIO pack05 and superseded cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cancel_one() {
            id="$1"
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.status')"
            echo "BEFORE $id $state"
            if [ "$state" != completed ]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null || true
            fi
          }
          cancel_one 33650455510
          cancel_one 33659203470
          for id in 33650455510 33659203470; do
            for n in 1 2 3 4 5 6; do
              state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.status')"
              echo "VERIFY $id $state"
              [ "$state" = completed ] && break
              sleep 5
            done
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.status')" = completed
          done
